<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BabyCoach - Baby Info Input</title>
<!-- Google Fonts: Nunito & Plus Jakarta Sans (Fallbacks) -->

              "inverse-primary": "#ffb59f",

              "on-tertiary-container": "#513b2d",
              "tertiary": "#73594a",
              "error-container": "#ffdad6",
              "surface-container": "#f3ede8",
              "on-background": "#1d1b18",
              "on-primary-fixed-variant": "#7e2b10",
              "surface-container-lowest": "#ffffff",

            fontFamily: {
              "headline": ["Nunito", "Plus Jakarta Sans", "sans-serif"],
              "body": ["Nunito", "Plus Jakarta Sans", "sans-serif"],
              "label": ["Nunito", "Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }

<style>
      body {
        font-family: 'Nunito', sans-serif;
        background-color: #fff8f3;
        background-image: radial-gradient(circle at 10% 20%, rgba(255, 140, 105, 0.05) 0%, transparent 40%),
                          radial-gradient(circle at 90% 80%, rgba(254, 178, 70, 0.05) 0%, transparent 40%);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1.5px solid rgba(255, 140, 105, 0.28);
        box-shadow: 0 8px 28px rgba(158, 66, 37, 0.08);
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .step-dot.active {
        width: 1.5rem;
        background: linear-gradient(135deg, #ff8c69, #feb246);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen text-on-background selection:bg-primary-container/30">
<!-- Top Navigation (Manual implementation following JSON style) -->
<header class="fixed top-0 left-0 w-full z-50 bg-[#fff8f3]/80 backdrop-blur-sm flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#9e4225] text-2xl" data-icon="baby_changing_station">baby_changing_station</span>
<h1 class="font-['Nunito'] font-black text-2xl tracking-tight text-[#9e4225]">BabyCoach</h1>
</div>
<div class="bg-gradient-to-r from-[#ff8c69] to-[#feb246] px-4 py-1.5 rounded-full shadow-sm">
<span class="text-white font-black text-sm">🔥 5</span>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-md mx-auto space-y-8">
<!-- Progress Indicator Section -->
<section class="space-y-4">
<div class="flex justify-between items-end">
<h2 class="text-on-surface font-black text-xl tracking-tight">1/3 아기 정보 👶</h2>
<div class="flex gap-1.5 mb-1.5">
<div class="step-dot active h-2 rounded-full transition-all duration-300"></div>
<div class="step-dot w-2 h-2 rounded-full bg-surface-container-highest transition-all duration-300"></div>
<div class="step-dot w-2 h-2 rounded-full bg-surface-container-highest transition-all duration-300"></div>
</div>
</div>
<div class="w-full bg-surface-container h-3 rounded-full overflow-hidden">
<div class="w-1/3 h-full bg-gradient-to-r from-[#ff8c69] to-[#feb246] rounded-full"></div>
</div>
</section>
<!-- Illustration Hero -->
<section class="flex justify-center py-4">
<div class="relative w-48 h-48 bg-secondary-fixed/30 rounded-full flex items-center justify-center">
<img alt="Cute Baby Bear Illustration" class="w-40 h-40 drop-shadow-xl" data-alt="Cute minimalist teddy bear character with a friendly expression, soft warm skin tones, and rounded features, centered on a soft peach background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDSBS3ItYo5ntdeIq8omco6kidlXmJ3I16h5CoTDRZBPjosa3Pn1hZhtfKHMyzcHj_RzGXvAbtkckkloHstKi_WDyJuhErOrwg69fYylW_z4fc5wAw5_umDLagHm27KTu1FEa81-owBJLc7knfjiQI4x4LOjVlO8eW6ZuIMLTRbM7SBecMbmJy5akcV3V3kfE0z9tAqzAW77-V-b8pqEWbZOB5Yyjz4cOEPysrwviN1RlEtXIHAePc0cwJiSSo9xmI2Zqt17h1xITRU"/>
<div class="absolute -bottom-2 -right-2 bg-white p-3 rounded-2xl shadow-lg border border-primary-container/20">
<span class="text-2xl">🧸</span>
</div>
</div>
</section>
<!-- Form Cards -->
<div class="space-y-6">
<!-- Card 1: Basic Stats -->
<div class="glass-card p-6 rounded-xl space-y-6">
<div>
<label class="block text-[#9e4225] font-extrabold text-sm uppercase tracking-wider mb-3">생년월일</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-4 text-on-surface font-bold focus:ring-2 focus:ring-primary-container" type="date" value="2024-01-01"/>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-3">
<label class="block text-[#9e4225] font-extrabold text-xs uppercase tracking-wider">나이 (개월)</label>
<div class="flex items-center justify-between bg-white rounded-xl p-1 shadow-sm border border-outline-variant/10">
<button class="w-10 h-10 flex items-center justify-center text-primary active:scale-90 transition-transform"><span class="material-symbols-outlined" data-icon="remove">remove</span></button>
<span class="font-black text-lg">4</span>
<button class="w-10 h-10 flex items-center justify-center text-primary active:scale-90 transition-transform"><span class="material-symbols-outlined" data-icon="add">add</span></button>
</div>
</div>
<div class="space-y-3">
<label class="block text-[#9e4225] font-extrabold text-xs uppercase tracking-wider">몸무게 (kg)</label>
<div class="flex items-center justify-between bg-white rounded-xl p-1 shadow-sm border border-outline-variant/10">
<button class="w-10 h-10 flex items-center justify-center text-primary active:scale-90 transition-transform"><span class="material-symbols-outlined" data-icon="remove">remove</span></button>
<span class="font-black text-lg">6.5</span>
<button class="w-10 h-10 flex items-center justify-center text-primary active:scale-90 transition-transform"><span class="material-symbols-outlined" data-icon="add">add</span></button>
</div>
</div>
</div>
</div>
<!-- Card 2: Allergies -->
<div class="glass-card p-6 rounded-xl space-y-4">
<label class="block text-[#9e4225] font-extrabold text-sm uppercase tracking-wider">알레르기 정보</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full bg-gradient-to-br from-[#ff8c69] to-[#feb246] text-white font-bold text-sm shadow-md active:scale-95 transition-all">없음</button>
<button class="px-4 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-bold text-sm hover:bg-surface-container-high transition-colors">우유</button>
<button class="px-4 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-bold text-sm hover:bg-surface-container-high transition-colors">달걀</button>
<button class="px-4 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-bold text-sm hover:bg-surface-container-high transition-colors">땅콩</button>
<button class="px-4 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-bold text-sm hover:bg-surface-container-high transition-colors">밀</button>
<button class="px-4 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-bold text-sm hover:bg-surface-container-high transition-colors">콩</button>
<button class="px-4 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-bold text-sm hover:bg-surface-container-high transition-colors">새우</button>
<button class="px-4 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-bold text-sm hover:bg-surface-container-high transition-colors">게</button>
</div>
</div>
<!-- Card 3: Notes -->
<div class="glass-card p-6 rounded-xl space-y-4">
<label class="block text-[#9e4225] font-extrabold text-sm uppercase tracking-wider">추가 참고 사항</label>
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-4 text-sm font-medium focus:ring-2 focus:ring-primary-container placeholder:text-outline/50" placeholder="아이의 건강 정보나 특징을 입력해주세요 (선택)" rows="3"></textarea>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full h-16 bg-gradient-to-r from-[#ff8c69] to-[#feb246] text-white rounded-full font-black text-lg flex items-center justify-center gap-2 shadow-xl shadow-primary-container/20 active:scale-[0.98] transition-all">
                다음으로 → 🌼
            </button>
</div>
</main>
<!-- Bottom Navigation Bar (Following JSON style) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-end px-4 pb-6 bg-white/88 backdrop-blur-md rounded-t-[3rem] shadow-[0px_-10px_30px_rgba(158,66,37,0.05)] border-t-1.5 border-[#ff8c69]/20">
<div class="flex flex-col items-center justify-center bg-gradient-to-br from-[#ff8c69] to-[#feb246] text-white rounded-full p-3 shadow-lg transform -translate-y-2 active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-['Nunito'] font-extrabold text-[10px] uppercase tracking-wider">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-[#c5a594] p-2 hover:text-[#9e4225] transition-colors">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
<span class="font-['Nunito'] font-extrabold text-[10px] uppercase tracking-wider">Milestones</span>
</div>
<div class="flex flex-col items-center justify-center text-[#c5a594] p-2 hover:text-[#9e4225] transition-colors">
<span class="material-symbols-outlined" data-icon="bedtime">bedtime</span>
<span class="font-['Nunito'] font-extrabold text-[10px] uppercase tracking-wider">Sleep</span>
</div>
<div class="flex flex-col items-center justify-center text-[#c5a594] p-2 hover:text-[#9e4225] transition-colors">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-['Nunito'] font-extrabold text-[10px] uppercase tracking-wider">Insights</span>
</div>
</nav>
</body></html>
